<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動けない人タイプ4診断</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  background: #F9F8F6;
  color: #2C2C2A;
  min-height: 100vh;
}

.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

.screen { display: none; }
.screen.active { display: block; }

.intro-card {
  background: #fff;
  border-radius: 16px;
  padding: 40px 28px;
  text-align: center;
  border: 1px solid #E8E6E1;
}
.intro-card h1 {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.6;
  margin-bottom: 12px;
}
.intro-card .accent { color: #534AB7; }
.intro-card p {
  font-size: 14px;
  color: #888780;
  line-height: 1.8;
  margin-bottom: 28px;
}
.intro-card .tag {
  display: inline-block;
  background: #EEEDFE;
  color: #534AB7;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 20px;
  margin-bottom: 20px;
}

.btn-start {
  display: inline-block;
  background: #534AB7;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  padding: 14px 48px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-start:hover { background: #3C3489; }

.progress-bar {
  width: 100%;
  height: 4px;
  background: #E8E6E1;
  border-radius: 2px;
  margin-bottom: 28px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #534AB7;
  border-radius: 2px;
  transition: width 0.4s ease;
}
.q-counter {
  font-size: 12px;
  color: #888780;
  margin-bottom: 8px;
  font-weight: 600;
}

.question-text {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.6;
  margin-bottom: 24px;
}

.choices { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #fff;
  border: 1.5px solid #E8E6E1;
  border-radius: 12px;
  padding: 16px 18px;
  font-size: 14px;
  line-height: 1.6;
  color: #2C2C2A;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  font-family: inherit;
}
.choice-btn:hover {
  border-color: #534AB7;
  background: #FAFAFE;
}
.choice-btn.selected {
  border-color: #534AB7;
  background: #EEEDFE;
}

.result-card {
  background: #fff;
  border-radius: 16px;
  padding: 36px 28px;
  border: 1px solid #E8E6E1;
}
.result-tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 12px;
}
.result-type-name {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 6px;
}
.result-catch {
  font-size: 14px;
  color: #888780;
  margin-bottom: 24px;
  line-height: 1.6;
}
.result-section {
  margin-bottom: 24px;
}
.result-section-title {
  font-size: 13px;
  font-weight: 700;
  color: #888780;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}
.result-section ul {
  list-style: none;
  padding: 0;
}
.result-section li {
  font-size: 14px;
  line-height: 1.7;
  padding: 4px 0 4px 20px;
  position: relative;
}
.result-section li::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 12px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.type-a li::before { background: #534AB7; }
.type-b li::before { background: #D85A30; }
.type-c li::before { background: #D4537E; }
.type-d li::before { background: #0F6E56; }

.result-strength {
  background: #F9F8F6;
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 24px;
}
.result-strength-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}
.result-strength p {
  font-size: 14px;
  line-height: 1.7;
  color: #5F5E5A;
}
.result-key {
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 24px;
}
.result-key-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}
.result-key p {
  font-size: 14px;
  line-height: 1.7;
}

.chart-section {
  margin-bottom: 24px;
}
.chart-bar-group {
  margin-bottom: 10px;
}
.chart-label {
  font-size: 12px;
  color: #888780;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.chart-track {
  width: 100%;
  height: 8px;
  background: #F1EFE8;
  border-radius: 4px;
  overflow: hidden;
}
.chart-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

.btn-retry {
  display: block;
  width: 100%;
  text-align: center;
  background: transparent;
  border: 1.5px solid #E8E6E1;
  border-radius: 30px;
  padding: 14px;
  font-size: 14px;
  font-weight: 600;
  color: #888780;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.2s;
}
.btn-retry:hover { border-color: #534AB7; color: #534AB7; }

.fade-in {
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">

  <div class="screen active" id="screen-intro">
    <div class="intro-card fade-in">
      <div class="tag">8問 / 約2分</div>
      <h1>あなたが<br><span class="accent">「動けない原因」</span>は<br>どのタイプ?</h1>
      <p>やらなきゃいけないのに動けない。<br>
        その原因は人によって全く違います。<br>
        8つの質問で、あなたのパターンを診断します。</p>
      <button class="btn-start" onclick="startQuiz()">診断スタート</button>
    </div>
  </div>

  <div class="screen" id="screen-quiz">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="q-counter" id="q-counter"></div>
    <div class="question-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="screen" id="screen-result">
    <div id="result-content"></div>
  </div>

</div>

<script>
const questions = [
  {
    q: "朝起きてから家を出るまで、どうなりがち?",
    choices: [
      { type: "A", text: "バタバタしているうちに気づけば時間がなくなっている" },
      { type: "B", text: "あれもこれも手をつけて、結局どれも中途半端になる" },
      { type: "C", text: "やることが多すぎて、何から始めればいいか分からず止まる" },
      { type: "D", text: "頭の中でやることを考えているうちに、時間だけが過ぎている" }
    ]
  },
  {
    q: "「今日は頑張ろう」と思った日、実際どうなる?",
    choices: [
      { type: "A", text: "気づけば予定外のことに時間を使っていて、やりたかったことに手がつかない" },
      { type: "B", text: "思いついた順に手をつけて、肝心なことが後回しになる" },
      { type: "C", text: "全部やろうとしてパンクし、結局どれも進まない" },
      { type: "D", text: "何から始めるかで迷っているうちに、やる気がなくなっている" }
    ]
  },
  {
    q: "スケジュール帳や手帳について、どれが近い?",
    choices: [
      { type: "A", text: "書いていない、または書いても見返さない" },
      { type: "B", text: "やることは書くけど、いつやるかまでは決めていない" },
      { type: "C", text: "詰め込みすぎて、毎回予定通りにいかない" },
      { type: "D", text: "書く前に「何を書けばいいんだろう」と考え込んでしまう" }
    ]
  },
  {
    q: "夜寝る前、頭の中はどんな状態?",
    choices: [
      { type: "A", text: "「今日も何に時間を使ったか分からない」とモヤモヤする" },
      { type: "B", text: "やりかけのことが気になって、つい手をつけてしまう" },
      { type: "C", text: "「あれもやらなきゃ、これもやらなきゃ」が止まらない" },
      { type: "D", text: "いろんなことが頭を巡って、整理がつかないまま眠れない" }
    ]
  },
  {
    q: "タスクが溜まってきたとき、どうなる?",
    choices: [
      { type: "A", text: "どれくらい時間がかかるか見えず、とりあえず目の前のことをやる" },
      { type: "B", text: "気になるものから片っ端に手をつけて、疲れて終わる" },
      { type: "C", text: "全部大事に見えて、何を先にやるべきか決められない" },
      { type: "D", text: "「一回整理しなきゃ」と思うけど、整理の仕方が分からない" }
    ]
  },
  {
    q: "締め切りが近い仕事があるとき、どうなりがち?",
    choices: [
      { type: "A", text: "「まだ時間ある」と思っていたら、ギリギリになっていた" },
      { type: "B", text: "他のことにも手を出してしまい、締め切りの仕事に集中できない" },
      { type: "C", text: "他にもやることがあって、どれを優先すべきか迷って焦る" },
      { type: "D", text: "やるべきことは分かっているけど、段取りが整理できず着手が遅れる" }
    ]
  },
  {
    q: "「自分、このままじゃまずい」と感じるのはどんなとき?",
    choices: [
      { type: "A", text: "1日が終わったのに、何をしていたか思い出せないとき" },
      { type: "B", text: "手をつけたまま放置していることが増えてきたとき" },
      { type: "C", text: "周りがどんどん進んでいるのに、自分だけ止まっていると感じたとき" },
      { type: "D", text: "考えれば考えるほど、何も決まらないと気づいたとき" }
    ]
  },
  {
    q: "誰かに「今、何に困ってる?」と聞かれたら?",
    choices: [
      { type: "A", text: "「とにかく時間がない」と答える" },
      { type: "B", text: "「やりたいことはあるんだけど、うまく進められなくて」と答える" },
      { type: "C", text: "「やることが多すぎて、何から手をつけていいか分からない」と答える" },
      { type: "D", text: "「頭の中がごちゃごちゃで、うまく説明できない」と答える" }
    ]
  }
];

const typeData = {
  A: {
    name: "「なんとなく忙しい」タイプ",
    color: "#534AB7",
    bgColor: "#EEEDFE",
    tagColor: "#534AB7",
    catch: "毎日バタバタ。でも「何に時間を使ったか」と聞かれると、答えられない。",
    symptoms: [
      "「時間がない」が口癖だが、実際に何に使っているか把握していない",
      "起床から出発までの時間に、使途不明の空白がある",
      "「まだ時間ある」と思っていたら、いつもギリギリになっている",
      "スケジュールを俯瞰して見たことがほとんどない",
      "忙しいはずなのに、成果として残っていることが少ない"
    ],
    strength: "実行力も集中力も持っています。スイッチが入れば短時間で高いアウトプットを出せる人。時間の使い方が「見える」ようになるだけで、一気に動けるようになるタイプです。",
    key: "あなたに必要なのは「まず今の時間の使い方を知ること」。感覚ではなく事実として自分の時間を見たとき、驚くほどの余白が見つかるかもしれません。",
    keyBg: "#EEEDFE",
    keyTitleColor: "#534AB7",
    keyTextColor: "#3C3489"
  },
  B: {
    name: "「とりあえず動く」タイプ",
    color: "#D85A30",
    bgColor: "#FAECE7",
    tagColor: "#D85A30",
    catch: "行動力はある。でも気づけば、やりかけのものだらけになっていませんか?",
    symptoms: [
      "思いついた順に手をつけて、肝心なことが後回しになる",
      "タスクを「まるごと塊」で捉えて、分解せずに動き出す",
      "新しいツールやアイデアに飛びつくが、構築しきる前に次へ行く",
      "やりかけのものが気になって、夜もつい手をつけてしまう",
      "締め切りがあると動けるが、自分では締め切りを設定できない"
    ],
    strength: "好奇心と行動力は最大の武器。タスクが分解されて「今日はこれだけ」と決まれば、驚くほどのスピードで動ける人です。完了までの道筋が見えれば、その行動力が全て成果に変わります。",
    key: "あなたに必要なのは「動く前に分ける」こと。やりたいことを実行可能な単位に細かくし、日程に配置する。それだけで、あなたの行動力がちゃんと成果につながるようになります。",
    keyBg: "#FAECE7",
    keyTitleColor: "#D85A30",
    keyTextColor: "#993C1D"
  },
  C: {
    name: "「あれもこれも」タイプ",
    color: "#D4537E",
    bgColor: "#FBEAF0",
    tagColor: "#D4537E",
    catch: "やるべきことは山ほどある。でも全部大事に見えて、1つに絞れない。",
    symptoms: [
      "全部やろうとしてスケジュールに詰め込みすぎてしまう",
      "何が一番大事か分からず、気になった順で動いてしまう",
      "「あの人はもっと進んでいるのに」と比べて焦りだけが募る",
      "細部の心配から入って、全体像を見失いやすい",
      "周りに相談したいけど、何から話していいか分からない"
    ],
    strength: "やりたいことがたくさんあるのは、意欲と可能性の証拠。「これだけやればいい」と絞れた瞬間、一気に動ける素直さとエネルギーを持っている人です。",
    key: "あなたに必要なのは「やらないことを決める勇気」。全部やるのではなく、目的から逆算して「今はこれだけ」と絞ること。心が驚くほど軽くなります。",
    keyBg: "#FBEAF0",
    keyTitleColor: "#D4537E",
    keyTextColor: "#72243E"
  },
  D: {
    name: "「頭の中ぐるぐる」タイプ",
    color: "#0F6E56",
    bgColor: "#E1F5EE",
    tagColor: "#0F6E56",
    catch: "能力はある。やる気もある。でも頭の中が渋滞して、動き出せない。",
    symptoms: [
      "考えれば考えるほど選択肢が増えて、何も決まらない",
      "1人で考えていると堂々巡りになり、結論が出ない",
      "アイデアは豊富だが、どこから手をつけるかで止まる",
      "頭の中にタスクが溜まると、思考スペースがなくなる感覚がある",
      "誰かに話を聞いてもらうと、一気に整理がつくことが多い"
    ],
    strength: "本来は決断力も実行力も高い人。壁打ち相手がいるだけで即決即行動に移れるタイプです。頭の中を外に出す仕組みがあれば、あなたの能力がフルに発揮されます。",
    key: "あなたに必要なのは「頭の中を外に出す場」。1人で整理しようとせず、思考を可視化すること。それだけで渋滞が解消され、本来の判断力が戻ってきます。",
    keyBg: "#E1F5EE",
    keyTitleColor: "#0F6E56",
    keyTextColor: "#04342C"
  }
};

let currentQ = 0;
let answers = { A: 0, B: 0, C: 0, D: 0 };

function startQuiz() {
  currentQ = 0;
  answers = { A: 0, B: 0, C: 0, D: 0 };
  showScreen("screen-quiz");
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById("progress").style.width = ((currentQ) / questions.length * 100) + "%";
  document.getElementById("q-counter").textContent = "Q" + (currentQ + 1) + " / " + questions.length;
  document.getElementById("q-text").textContent = q.q;

  const container = document.getElementById("choices");
  container.innerHTML = "";
  container.className = "choices fade-in";

  const shuffled = [...q.choices].sort(() => Math.random() - 0.5);

  shuffled.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = c.text;
    btn.onclick = () => selectAnswer(c.type, btn);
    container.appendChild(btn);
  });
}

function selectAnswer(type, btn) {
  document.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  answers[type]++;

  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) {
      renderQuestion();
    } else {
      document.getElementById("progress").style.width = "100%";
      setTimeout(() => showResult(), 300);
    }
  }, 400);
}

function getResult() {
  const sorted = Object.entries(answers).sort((a, b) => b[1] - a[1]);
  if (sorted[0][1] === sorted[1][1]) {
    const tieTypes = sorted.filter(s => s[1] === sorted[0][1]).map(s => s[0]);
    const q1Type = questions[0].choices.find(c => tieTypes.includes(c.type));
    const q2Type = questions[1].choices.find(c => tieTypes.includes(c.type));
    if (q1Type) return q1Type.type;
    if (q2Type) return q2Type.type;
  }
  return sorted[0][0];
}

function showResult() {
  const resultType = getResult();
  const data = typeData[resultType];
  const total = Object.values(answers).reduce((a, b) => a + b, 0);

  const typeClass = "type-" + resultType.toLowerCase();
  const barColors = { A: "#534AB7", B: "#D85A30", C: "#D4537E", D: "#0F6E56" };
  const typeNames = {
    A: "「なんとなく忙しい」タイプ",
    B: "「とりあえず動く」タイプ",
    C: "「あれもこれも」タイプ",
    D: "「頭の中ぐるぐる」タイプ"
  };

  let chartHTML = "";
  const sortedAnswers = Object.entries(answers).sort((a, b) => b[1] - a[1]);
  sortedAnswers.forEach(([t, count]) => {
    const pct = Math.round(count / total * 100);
    chartHTML += '<div class="chart-bar-group"><div class="chart-label"><span>' +
      typeNames[t] + (t === resultType ? " (あなた)" : "") +
      '</span><span>' + pct + '%</span></div><div class="chart-track"><div class="chart-fill" style="width:' +
      pct + '%;background:' + barColors[t] + ';"></div></div></div>';
  });

  const html = '<div class="result-card fade-in">' +
    '<div class="result-tag" style="background:' + data.bgColor + ';color:' + data.tagColor + ';">あなたのタイプ</div>' +
    '<div class="result-type-name" style="color:' + data.color + ';">' + data.name + '</div>' +
    '<div class="result-catch">' + data.catch + '</div>' +
    '<div class="result-section ' + typeClass + '"><div class="result-section-title">こんな状態になっていませんか?</div><ul>' +
    data.symptoms.map(function(s) { return "<li>" + s + "</li>"; }).join("") +
    '</ul></div>' +
    '<div class="result-strength"><div class="result-strength-title">このタイプの強み</div><p>' + data.strength + '</p></div>' +
    '<div class="result-key" style="background:' + data.keyBg + ';"><div class="result-key-title" style="color:' + data.keyTitleColor + ';">動き出すためのヒント</div><p style="color:' + data.keyTextColor + ';">' + data.key + '</p></div>' +
    '<div class="chart-section"><div class="result-section-title">あなたの傾向バランス</div>' + chartHTML + '</div>' +
    '<button class="btn-retry" onclick="startQuiz()">もう一度診断する</button></div>';

  document.getElementById("result-content").innerHTML = html;
  showScreen("screen-result");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
</script>

</body>
</html>
